name: pkg
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  npm:
    name: publish to npm and ghp
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: build dist/lib and publish for npm and github packages
        shell: bash
        env:
            NPM_TOKEN: ${{secrets.NPM_TOKEN}}
            GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
            CHATBOT_WORKER_URL: ${{ secrets.CHATBOT_WORKER_URL }}
            KOKORO_WORKER_URL: ${{ secrets.KOKORO_WORKER_URL }}
        run: |
          bash .devops/build_dist_lib.sh
          bash .devops/replaceWorkers.sh "$CHATBOT_WORKER_URL" "$KOKORO_WORKER_URL"
          bash .devops/publish.sh "$NPM_TOKEN" "$GH_TOKEN"
