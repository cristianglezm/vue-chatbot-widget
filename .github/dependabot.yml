# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - cristianglezm
    open-pull-requests-limit: 8
    ignore:
      # the unit tests mock transformers.js: a green run proves nothing about a new major.
      # Migrate by hand after the investigation (plan, section 12), then remove this.
      - dependency-name: "@huggingface/transformers"
        update-types: ["version-update:semver-major"]
      # 5.x bundles the declarations with `__VLS_*` helper names that are not declared (SwitchPanel's slots):
      # consumers get a main.d.ts that does not compile. 4.5.4 emits valid declarations with vite 8.
      - dependency-name: "vite-plugin-dts"
        update-types: ["version-update:semver-major"]
      # 7 is the native (Go) port: typescript-eslint declares `typescript <6.1.0` and vue-tsc / api-extractor use
      # the JS API. Revisit when they support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      AI:
        patterns:
          - "@huggingface/*"
          - "kokoro-js"
      dependencies:
        patterns:
          - "mitt"
          - "pinia"
          - "vue"
          - "prismjs"
      misc:
        patterns:
          - "waveform-data"
      dev-typescript:
        patterns:
          - "@tsconfig/node*"
          - "@types/*"
          - "@typescript-*"
          - "@vue/tsconfig"
          - "typescript"
          - "vue-tsc"
        exclude-patterns:
          - "@types/jsdom"
      dev-vite:
        patterns:
          - "@vitejs/plugin-vue"
          - "vite*"
        exclude-patterns:
          - "vitest"
      dev-test:
        patterns:
          - "@playwright/test"
          - "@types/jsdom"
          - "@vitest/*"
          - "@vue/test-utils"
          - "jsdom"
          - "vitest"
      dev-misc:
        patterns:
          - "@eslint/js"
          - "eslint*"
          - "vue-eslint-parser"
          - "@vue/eslint-config-prettier"
          - "@vue/eslint-config-typescript"
          - "prettier"
          - "globals"
          - "jiti"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - cristianglezm
